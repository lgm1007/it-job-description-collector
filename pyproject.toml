[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-description-collector"
version = "0.1.0"
description = "국내 채용 사이트(원티드·리멤버·잡플래닛·점핏·사람인·잡코리아)의 개발자 채용공고를 browser-harness로 수집해 Supabase에 올리는 수집기"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "browser-harness==0.1.13",
    "psycopg[binary]>=3.2",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jdc = "jdc.cli:main"

[tool.setuptools.packages.find]
include = ["jdc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
